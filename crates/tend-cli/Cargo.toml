[package]
name = "tend-cli"
description = "Local supervisor for command-line coding agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "tend"
path = "src/main.rs"

[dependencies]
tend-core.workspace = true
anyhow.workspace = true
clap.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
# Fleet files (F3a). The old clash with the `winnow` crate ended with the rename.
toml = { version = "0.8", default-features = false, features = ["parse"] }
