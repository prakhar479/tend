[workspace]
resolver = "2"
members = ["crates/winnow-core", "crates/winnow"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
winnow-core = { path = "crates/winnow-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
